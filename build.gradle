plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = "com.railsounds"
base { archivesName = "create-rail-sounds-${project.minecraft_version}" }

loom {
    accessWidenerPath = file("src/main/resources/railsounds.classtweaker")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Create Fly (CC0) - compile against it, it is NOT bundled into our jar
    compileOnly files("libs/create-fly.jar")
    // only for the CI test-server boot (gradlew runServer), never shipped
    localRuntime files("libs/create-fly.jar")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
    // ship the sounds inside the jar too, so clients with the mod don't need the server pack
    from("server-resourcepack") { include "assets/**" }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
