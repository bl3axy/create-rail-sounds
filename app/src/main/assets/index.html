<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1318">
<title>3xtons Rail Planner</title>
<style>
:root {
  --bg: #0e1318; --panel: #161d24; --panel2: #1d262f; --line: #2a3540; --text: #e6edf3; --dim: #8b98a5;
  --accent: #f2b84b; --accent2: #ffcf70; --green: #3ddc84; --red: #ff5d5d; --yellow: #ffd23f; --blue: #5aa9ff;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 48px; cursor: pointer; }
button:active { filter: brightness(1.25); }
button.primary { background: var(--accent); color: #1a1405; border-color: var(--accent); font-weight: 650; }
button.danger { color: var(--red); }
button.ghost { background: transparent; border-color: transparent; }
input[type=text], input[type=number], input[type=url], select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; width: 100%; color: var(--text); font-size: 16px; }
textarea { font: 12px/1.4 ui-monospace, monospace; min-height: 140px; resize: vertical; }
input[type=number] { width: 84px; }
label { color: var(--dim); font-size: 13px; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 6px; padding: calc(6px + var(--safe-t)) 8px 6px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 5; }
header h1 { font-size: 16px; margin: 0 4px 0 2px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
header h1 span { color: var(--accent); }
header .sp { flex: 1; }
header button { min-height: 46px; min-width: 46px; padding: 6px 10px; font-size: 17px; }
@media (max-width: 460px) { header h1 { display: none; } header { gap: 5px; } }
#play { min-width: 76px; font-weight: 700; white-space: nowrap; }
#play.on { background: var(--green); color: #06210f; border-color: var(--green); }
#clock { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 40px; text-align: right; }

#stage { position: relative; flex: 1; overflow: hidden; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: calc(100% - 24px); font-size: 14px !important;
  background: rgba(22,29,36,.94); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px;
  display: flex; gap: 10px; align-items: center; pointer-events: auto; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
#hint:empty { display: none; }
#hint.fade { opacity: 0; pointer-events: none; transition: opacity .6s; }
#hint button { min-height: 32px; padding: 3px 12px; border-radius: 999px; font-size: 14px; }
#fab { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
#fab button { width: 52px; height: 52px; padding: 0; border-radius: 14px; background: rgba(29,38,47,.94); font-size: 22px; }
#pendbar { position: absolute; left: 8px; right: 70px; bottom: 8px; background: rgba(22,29,36,.97); border: 1px solid var(--line); border-radius: 16px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#pendbar[hidden] { display: none; }
#pendbar .btns { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 0.8fr; gap: 6px; }
#pendbar button { min-height: 54px; padding: 4px 2px; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
#pendbar button b { font-size: 20px; line-height: 1; }
#pendbar button:disabled { opacity: .4; }
#pbInfo { font-size: 15px; padding: 2px 4px 2px; font-weight: 700; }
#pbLock { font-size: 13px; color: var(--dim); padding: 0 4px 8px; }
#pbInfo.good { color: #7dffb3; } #pbInfo.warn { color: #ffcf70; } #pbInfo.bad { color: #ff8a8a; }
#toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%) translateY(-20px); z-index: 6; opacity: 0; transition: .2s;
  background: #24303b; border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-size: 14px; max-width: calc(100% - 90px); pointer-events: none; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%); }

nav#tools { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--panel); border-top: 1px solid var(--line);
  padding: 4px 4px calc(4px + var(--safe-b)); z-index: 5; }
nav#tools button { background: transparent; border: none; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 12.5px; color: var(--dim); padding: 8px 0; min-height: 64px; }
nav#tools button svg { width: 28px; height: 28px; }
nav#tools button.on { color: var(--accent); background: rgba(242,184,75,.10); }

#sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 58%; background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0; z-index: 20; transform: translateY(105%); transition: transform .22s ease; display: flex; flex-direction: column;
  box-shadow: 0 -10px 30px rgba(0,0,0,.45); padding-bottom: var(--safe-b); }
#sheet.open { transform: none; }
#sheet .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
#sheet .top h2 { margin: 0; font-size: 19px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sheet .grab { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 7px auto 0; }
#sheetBody { overflow-y: auto; padding: 4px 12px 16px; -webkit-overflow-scrolling: touch; }
.sec { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); font-weight: 650; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.row > .grow { flex: 1; min-width: 120px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: nowrap; }
.seg button { border: none; border-radius: 0; flex: 1; background: transparent; padding: 10px 6px; font-size: 15px; min-height: 48px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: #1a1405; font-weight: 650; }
.note { color: var(--dim); font-size: 13px; margin: 4px 0; }
.status { padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; margin: 6px 0; }
.strip { display: flex; align-items: center; overflow-x: auto; padding: 14px 12px 8px 2px; gap: 0; }
.veh { display: flex; flex-direction: column; align-items: center; min-width: 72px; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); position: relative; }
.veh .t { font-size: 12px; color: var(--dim); }
.veh .ic { font-size: 20px; line-height: 1; }
.veh .x { position: absolute; top: -10px; right: -10px; width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 50%; font-size: 14px; background: var(--panel2); }
.cut { min-height: 48px; min-width: 34px; padding: 4px 2px; border: none; background: transparent; color: var(--dim); font-size: 20px; }
.frontTag { font-size: 11px; color: var(--accent); margin-right: 6px; writing-mode: vertical-rl; transform: rotate(180deg); }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin: 8px 0; background: var(--panel2); }
.card .row { margin: 4px 0; flex-wrap: nowrap; }
.card select { width: auto; min-width: 0; }
.card .grow { min-width: 0; }
.card .grow select { width: 100%; }
.card .row.wrap { flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 14px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 15px; }
.chip input[type=number] { width: 70px; min-height: 40px; padding: 4px 8px; }
.chip button { min-height: 36px; min-width: 36px; padding: 0 10px; border-radius: 999px; font-size: 14px; }
.list .item { display: flex; align-items: center; gap: 12px; padding: 14px 6px; border-bottom: 1px solid var(--line); }
.list .item:last-child { border-bottom: none; }
.sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.item .main { flex: 1; min-width: 0; }
.item .sub { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log div { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.log span { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 8px; }
.check { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 14px; }
.check { min-height: 48px; }
.check input { width: 26px; height: 26px; accent-color: var(--accent); }
details { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
details summary { cursor: pointer; font-weight: 600; }
details p, details li { color: var(--dim); font-size: 13.5px; }
details ul { padding-left: 18px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>3xtons <span>Rail Planner</span></h1>
    <button id="play" title="Play / pause">▶ Play</button>
    <button id="speed" title="Simulation speed">1×</button>
    <button id="reset" title="Back to before you pressed Play" hidden>⟲</button>
    <span id="clock"></span>
    <span class="sp"></span>
    <button id="undo" title="Undo">↶</button>
    <button id="trainsBtn" title="Trains">🚆</button>
    <button id="menuBtn" title="Menu">☰</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="pendbar" hidden>
      <div id="pbInfo"></div><div id="pbLock"></div>
      <div class="btns">
        <button id="pbPlace" class="primary"><b>✓</b>Place</button>
        <button id="pbFlip"><b>⇅</b>Flip bend</button>
        <button id="pbStraight"><b>—</b>Straight</button>
        <button id="pbFit"><b>↺</b>Reset</button>
        <button id="pbCancel"><b>✕</b>Cancel</button>
      </div>
    </div>
    <div id="fab">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="fit" title="Fit to screen">⤢</button>
      <button id="logBtn" title="Event log">≡</button>
    </div>
    <div id="toast"></div>
  </div>
  <nav id="tools">
    <button data-tool="select" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg>Select</button>
    <button data-tool="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3c0 6 8 12 8 18M4 6h7M5 10h8M8 14h8M11 18h7"/></svg>Track</button>
    <button data-tool="station"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="6" width="16" height="9" rx="2"/><path d="M8 19l2-4M16 19l-2-4M9 10h6"/></svg>Station</button>
    <button data-tool="signal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="2.5" width="8" height="13" rx="3"/><circle cx="12" cy="6.5" r="1.6"/><circle cx="12" cy="11.5" r="1.6"/><path d="M12 15.5V21M8 21h8"/></svg>Signal</button>
    <button data-tool="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="13.5" r=".8"/><circle cx="15" cy="13.5" r=".8"/></svg>Train</button>
    <button data-tool="erase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 16l9-9 6 6-6 6H8z M10 10l6 6M13 19h7"/></svg>Erase</button>
  </nav>
</div>
<div id="sheet">
  <div class="grab"></div>
  <div class="top"><h2 id="sheetTitle"></h2><button id="sheetClose" class="ghost">✕</button></div>
  <div id="sheetBody"></div>
</div>
<script>
/*
 * Rail Planner core: track graph, trains (consists), routing, signals, coupling and schedules.
 * Mirrors the rules of Create (Fly) trains + Steam 'n' Rails + Create Rail Sounds:
 *  - a train's FRONT is where it was built facing; cars inside a train all face that way
 *  - couplings join one train's BACK to another's FRONT (front-to-front / back-to-back can't couple)
 *  - single-cab locos only drive forwards; double-cab (controls both ends) drive either way
 *  - "Back into Station" (or a station marked back-in / reverse) lets a single-cab train reverse
 *    for that whole trip; Create can't change direction part-way through a trip
 *  - a station only accepts trains travelling the way its arrow points; the leading end stops on it
 *  - signals split the track into blocks; a train waits at a signal if the block beyond is
 *    occupied or claimed; chain signals also need the block after that to be free
 *  - collision safety net: trains brake for anything on the track they're about to use
 * Units: blocks and seconds. No DOM in here so it can be tested in node.
 */
(function (root) {
  'use strict';

  const LEN = { loco1: 6, loco2: 7, car: 5 };       // vehicle lengths in blocks
  const GAP = 1;                                    // space between coupled vehicles
  const COUPLE_REACH = 1.85;                        // contactGap + couplerReach from the mod
  const HIT = 1.0;                                  // body point this close to our path = in the way
  const STOP_SHORT = 0.4;                           // stop this far short of an obstacle
  const SMOOTH = 0.5;
  const ARRIVE_SLACK = 8;                           // stopped against parked cars this close to the marker = arrived                               // cos(60deg): sharpest turn a train can take at a node

  function newState() {
    return {
      nodes: {}, edges: {}, stations: {}, signals: {}, consists: {},
      nextId: 1,
      settings: { maxSpeed: 28, turnSpeed: 14, accel: 3, decel: 3, autoCouple: true }, // Create defaults: top speed 28 b/s, acceleration 3 b/s2
      log: [], time: 0,
    };
  }
  const nid = (s, p) => p + (s.nextId++);

  // ---------------------------------------------------------------- graph
  function addNode(s, x, z) { const k = nid(s, 'n'); s.nodes[k] = { x, z }; return k; }
  function edgeLen(s, e) {
    const E = s.edges[e]; if (!E) return 0;
    const A = s.nodes[E.a], B = s.nodes[E.b];
    return Math.hypot(B.x - A.x, B.z - A.z);
  }
  function findEdge(s, a, b) {
    for (const k in s.edges) { const E = s.edges[k]; if ((E.a === a && E.b === b) || (E.a === b && E.b === a)) return k; }
    return null;
  }
  function addEdge(s, a, b) {
    if (a === b || !s.nodes[a] || !s.nodes[b]) return null;
    const ex = findEdge(s, a, b); if (ex) return ex;
    const k = nid(s, 'e'); s.edges[k] = { a, b }; bump(s);
    for (const n of [a, b]) if (s.nodes[n].c && edgesAt(s, n).length > 2) delete s.nodes[n].c;
    return k;
  }
  /** edges touching node n (cached; the cache is rebuilt whenever the set of edges changes) */
  function edgesAt(s, n) {
    if (!s._adj || s._adjRev !== (s.rev || 0) || s._adjEdges !== s.edges) {
      const adj = {};
      for (const k in s.edges) { const E = s.edges[k]; (adj[E.a] = adj[E.a] || []).push(k); if (E.b !== E.a) (adj[E.b] = adj[E.b] || []).push(k); }
      Object.defineProperty(s, '_adj', { value: adj, writable: true, configurable: true, enumerable: false });
      s._adjRev = s.rev || 0; Object.defineProperty(s, '_adjEdges', { value: s.edges, writable: true, configurable: true, enumerable: false });
    }
    return (s._adj[n] || []).slice();
  }
  const bump = s => { s.rev = (s.rev || 0) + 1; };
  function pointAt(s, e, d) {
    const E = s.edges[e], A = s.nodes[E.a], B = s.nodes[E.b];
    const L = Math.hypot(B.x - A.x, B.z - A.z) || 1;
    const t = Math.max(0, Math.min(1, d / L));
    return { x: A.x + (B.x - A.x) * t, z: A.z + (B.z - A.z) * t };
  }
  function dirVec(s, e, dir) {
    const E = s.edges[e], A = s.nodes[E.a], B = s.nodes[E.b];
    const L = Math.hypot(B.x - A.x, B.z - A.z) || 1;
    return { x: (B.x - A.x) / L * dir, z: (B.z - A.z) / L * dir };
  }
  const endNode = (s, e, dir) => (dir > 0 ? s.edges[e].b : s.edges[e].a);
  const startNode = (s, e, dir) => (dir > 0 ? s.edges[e].a : s.edges[e].b);

  /** where a train on directed edge (e,dir) can go at the far node: smooth turns only, straightest first */
  function nextOptions(s, e, dir) {
    const n = endNode(s, e, dir), v = dirVec(s, e, dir), out = [];
    for (const f of edgesAt(s, n)) {
      if (f === e) continue;
      const fd = s.edges[f].a === n ? 1 : -1;
      const w = dirVec(s, f, fd), dot = v.x * w.x + v.z * w.z;
      if (dot > SMOOTH) out.push({ e: f, dir: fd, dot });
    }
    out.sort((p, q) => q.dot - p.dot);
    return out;
  }

  function removeNode(s, n) {
    for (const e of edgesAt(s, n)) removeEdge(s, e);
    delete s.nodes[n];
  }
  function removeEdge(s, e) {
    for (const k in s.stations) if (s.stations[k].e === e) delete s.stations[k];
    for (const k in s.signals) if (s.signals[k].e === e) delete s.signals[k];
    for (const k in s.consists) if (s.consists[k].path.some(p => p.e === e)) delete s.consists[k];
    const E = s.edges[e];
    delete s.edges[e]; bump(s);
    // a curve point left with fewer than two tracks is a normal track end again (so you can extend it)
    if (E) for (const n of [E.a, E.b]) if (s.nodes[n] && s.nodes[n].c && edgesAt(s, n).length < 2) delete s.nodes[n].c;
  }

  /** cut edge e at distance d with a new node; stations, signals and trains on it move over */
  function splitEdge(s, e, d) {
    const E = s.edges[e]; if (!E) return null;
    const L = edgeLen(s, e);
    if (d < 0.5 || d > L - 0.5) return d < L / 2 ? E.a : E.b;
    const P = pointAt(s, e, d), n = addNode(s, Math.round(P.x * 100) / 100, Math.round(P.z * 100) / 100);
    const e1 = nid(s, 'e'), e2 = nid(s, 'e');
    s.edges[e1] = { a: E.a, b: n }; s.edges[e2] = { a: n, b: E.b }; bump(s);
    const L1 = edgeLen(s, e1), L2 = edgeLen(s, e2), k1 = L1 / d, k2 = L2 / (L - d);
    const map = x => (x <= d ? { e: e1, d: x * k1 } : { e: e2, d: (x - d) * k2 });
    for (const k in s.stations) { const t = s.stations[k]; if (t.e === e) { const m = map(t.d); t.e = m.e; t.d = m.d; } }
    for (const k in s.signals) { const t = s.signals[k]; if (t.e === e) { const m = map(t.d); t.e = m.e; t.d = m.d; } }
    for (const k in s.consists) {
      const c = s.consists[k], out = [];
      for (const sg of c.path) {
        if (sg.e !== e) { out.push(sg); continue; }
        const lo = Math.min(sg.d0, sg.d1), hi = Math.max(sg.d0, sg.d1);
        const parts = [];
        if (lo < d) parts.push({ e: e1, lo: lo * k1, hi: Math.min(hi, d) * k1 });
        if (hi > d || (hi === lo && lo >= d)) parts.push({ e: e2, lo: (Math.max(lo, d) - d) * k2, hi: (hi - d) * k2 });
        if (sg.dir < 0) parts.reverse();
        for (const q of parts) out.push(sg.dir > 0 ? { e: q.e, dir: 1, d0: q.lo, d1: q.hi } : { e: q.e, dir: -1, d0: q.hi, d1: q.lo });
      }
      c.path = out;
      if (c.run && c.run.route) {
        const r = [];
        for (const st of c.run.route) {
          if (st.e !== e) r.push(st);
          else if (st.dir > 0) r.push({ e: e1, dir: 1 }, { e: e2, dir: 1 }); else r.push({ e: e2, dir: -1 }, { e: e1, dir: -1 });
        }
        c.run.route = r;
      }
    }
    delete s.edges[e]; bump(s);
    return n;
  }
  /** move a node (only when no train sits on its track); stations/signals keep their place proportionally */
  function moveNode(s, n, x, z) {
    const es = edgesAt(s, n);
    for (const k in s.consists) if (s.consists[k].path.some(p => es.includes(p.e))) return false;
    const before = {}; for (const e of es) before[e] = edgeLen(s, e);
    s.nodes[n].x = x; s.nodes[n].z = z;
    for (const e of es) {
      const k = before[e] ? edgeLen(s, e) / before[e] : 1;
      for (const id in s.stations) if (s.stations[id].e === e) s.stations[id].d *= k;
      for (const id in s.signals) if (s.signals[id].e === e) s.signals[id].d *= k;
    }
    return true;
  }
  /** nearest point on any track to (x,z) */
  function nearestTrack(s, x, z) {
    let best = null;
    for (const e in s.edges) {
      const E = s.edges[e], A = s.nodes[E.a], B = s.nodes[E.b];
      const vx = B.x - A.x, vz = B.z - A.z, L2 = vx * vx + vz * vz || 1;
      const t = Math.max(0, Math.min(1, ((x - A.x) * vx + (z - A.z) * vz) / L2));

    ptrs.delete(e.pointerId);
    if (gesture && gesture.type === 'tap' && ptrs.size === 0) onTap(e.offsetX, e.offsetY);
    if (gesture && gesture.type === 'draw' && ptrs.size === 0) {
      if (gesture.moved && gesture.end) {
        if (gesture.start.bad) toast(gesture.start.bad);
        else setPend({ a: gesture.start, b: gesture.end.bad ? resolveSpotFree(e.offsetX, e.offsetY) : gesture.end, want: null, pick: {} });
      } else toast('Drag from where the track starts to where it ends');
      dirty = true;
    }
    if (gesture && gesture.type === 'node' && ptrs.size === 0) { changed(); if (gesture.warned) undo.pop(); }
    if (ptrs.size === 0) gesture = null;
    else if (gesture && gesture.type === 'pinch') gesture = { type: 'done' };
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); if (!ptrs.size) gesture = null; });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const f = Math.exp(-e.deltaY * 0.0015), k = Math.max(0.03, Math.min(60, view.k * f));
    const x0 = wx(e.offsetX), z0 = wz(e.offsetY);
    view.k = k; view.x = x0 - (e.offsetX - W / 2) / k; view.z = z0 - (e.offsetY - H / 2) / k; dirty = true;
  }, { passive: false });

  function onTap(px, py) {
    if (tool === 'track') return; // taps while laying track do nothing (drag pans)
    if (tool === 'station') return tapStation(px, py);
    if (tool === 'signal') return tapSignal(px, py);
    if (tool === 'train') return tapTrain(px, py);
    if (tool === 'erase') return tapErase(px, py);

  }

  // ------------------------------------------------------------------ sheet

  // element helpers
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);

      else if (k === 'cls') n.className = attrs[k];

  function compass(v) {
    const a = Math.atan2(v.x, -v.z) * 180 / Math.PI; // 0 = north (-z), 90 = east (+x)
    const names = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
    return names[(Math.round(((a % 360) + 360) % 360 / 45)) % 8];
  }

  /** keep a world point in the part of the map the sheet doesn't cover */

    if (!p) return;
    const py = sz(p.z), px = sx(p.x), maxY = H * 0.38;
    if (py > maxY || py < 30) view.z = p.z - (maxY * 0.6 - H / 2) / view.k;

      if (h.kind === 'signal') return C.pointAt(S, S.signals[h.id].e, S.signals[h.id].d);
      if (h.kind === 'node') return S.nodes[h.id];
      if (h.kind === 'edge') return C.pointAt(S, h.id, h.at || C.edgeLen(S, h.id) / 2);
    } catch (e) { return null; }
    return null;
  }
  function select(h, keepScroll) {

    if (h.kind === 'train') trainSheet(h.id);
    else if (h.kind === 'station') stationSheet(h.id);

  // ---------------- signal

  // ---------------- track

  }

      b.append(sec('Settings'));
      const num = (label, key, min, max, stepv) => el('div', { cls: 'row' }, el('div', { cls: 'grow' }, label),
        el('input', { type: 'number', min, max, step: stepv, value: S.settings[key], on: { change: e => { const v = Math.max(min, Math.min(max, +e.target.value || min)); S.settings[key] = v; changed(); } } }));
      b.append(num('Top speed (blocks/s)', 'maxSpeed', 1, 100, 1), num('Top speed on curves (blocks/s)', 'turnSpeed', 1, 100, 1), num('Acceleration (blocks/s²)', 'accel', 0.2, 20, 0.1), num('Braking (blocks/s²)', 'decel', 0.2, 20, 0.1));
      b.append(note('Create defaults: top speed 28, curves 14, acceleration 3 (Create brakes with the same value). Match these to your server config if you changed them.'));
      b.append(el('label', { cls: 'check' }, el('input', { type: 'checkbox', checked: S.settings.autoCouple !== false, on: { change: e => { S.settings.autoCouple = e.target.checked; changed(); } } }), 'Auto-couple when driving into cars (J in game)'));
      b.append(el('label', { cls: 'check' }, el('input', { type: 'checkbox', checked: S.settings.grid !== false, on: { change: e => { S.settings.grid = e.target.checked; changed(); } } }), 'Show grid'));
      // help
      b.append(sec('How it works'));
      b.append(el('details', {}, el('summary', {}, 'Rules (same as the game)'), el('ul', {},
        ['Every car in a train faces the way the train was built. The white arrow is the train\'s front.',
          'Trains couple back-to-front only: the back of one train to the front of the other. Front-to-front can\'t couple - turn one round with a wye or loop.',
          'A single-cab loco only drives forwards. A loco with cabs both ways (Loco ⇄) can drive either way.',
          '"Back into" a station (or a station set to Must back in) makes even a single-cab train reverse for that whole trip, starting from its last stop. Create can\'t change direction mid-trip.',
          'Stations only take trains travelling the way the arrow points. The leading end stops on the line.',
          'Signals split track into blocks. Red = block taken. Chain signals (diamonds) look past the next signal too; yellow = the way ahead is blocked further on.',
          'Safety net (the mod): a train brakes for anything on the track ahead, and eases up to parked cars so it can couple.',
          'Couple up / Uncouple conditions run when the train has stopped. Uncouple N drops N cars off the end away from the loco; 0 = all cars.',
          'Route choice copies Create: it avoids track with parked trains, busy blocks behind signals and other stations, and re-routes every few seconds while held at a chain signal.',
          'Auto-couple (on by default, J in game) only grabs parked cars when you drive into them, never another loco - use Couple for that. Trains on a schedule never grab cars mid-route.',
          'The train doing the coupling keeps its name; whichever train has a schedule keeps it.',
          'Coupling and uncoupling only work at 3 blocks/s or slower.',
          'Trains slow to 14 blocks/s on curves and can\'t take a joint sharper than 60°. You can\'t put a switch in the middle of a curve.',
          'A station yard rule (Couple up / Uncouple) runs about 1 second after the train stops, for every train that stops there.'].map(t => el('li', {}, t)))));
      b.append(el('details', {}, el('summary', {}, 'Messages you\'ll see (same as the game)'), el('ul', {},
        ["No station on graph matches '<name>' - the schedule names a station that doesn't exist (check spelling).",
          'No suitable path to the next Scheduled destination could be found - no track goes there, or the station arrow points the way trains can\'t arrive from.',
          'Path requires a driver facing the opposite direction - there is a way, but only backwards. Single-cab loco: use Back into, set the station to Either way / Must back in, or turn the loco round on a wye or loop.',
          'Attach at least one forward-facing Train Controls block - cars on their own can\'t run a schedule; they need a loco.',
          'A Carriage has reached the end of its Track - you drove off the end.',
          'Nothing close enough to couple to (get within 1.5 blocks) / Too fast to couple / Can\'t couple: those cars face the other way round - the mod\'s coupling messages.',
          'Waiting at signal / Stopped behind <train> - held by a signal, or by the safety net.'].map(t => el('li', {}, t)))));
      b.append(el('details', {}, el('summary', {}, 'Controls'), el('ul', {},
        ['Track: drag from where it starts to where it ends, then drag the blue handle to bend it whichever way (headings snap to N/NE/E... when close). Starting on a track end, the curve carries straight on from it and the handle slides along that line. Start in the middle of a straight to make a switch; Flip picks which way the switch faces. ✓ Place when the info line is green.',
          'Pinch to zoom, drag to pan. In Select you can drag a joint to move it.',
          'Tap a train to add cars, drive it, uncouple (✂) or give it a schedule.',
          'Play runs all scheduled trains. ⟲ puts everything back to how it was before you pressed Play.'].map(t => el('li', {}, t)))));
    }, 'menu');
  }
  let menuRefs = null;
  function confirmLose() { return !Object.keys(S.nodes).length || window.confirm('Replace the current layout? (Undo can bring it back)'); }

  function exportLayout() {
    const json = C.serialize(S);
    if (window.AndroidBridge && window.AndroidBridge.share) { try { window.AndroidBridge.share(json, 'rail-layout.json'); return; } catch (e) { /* fall back */ } }
    openSheet('Export', b => {
      const ta = el('textarea', { readOnly: true }); ta.value = json;
      b.append(note('Copy this text and keep it somewhere (notes, Drive...). Paste it back with Import.'), ta,
        el('div', { cls: 'row' }, btn('Copy', () => { ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ } if (!ok && navigator.clipboard) navigator.clipboard.writeText(json).then(() => toast('Copied'), () => toast('Select the text and copy it')); else toast(ok ? 'Copied' : 'Select the text and copy it'); }),
          btn('Download', () => { const a = el('a', { href: URL.createObjectURL(new Blob([json], { type: 'application/json' })), download: 'rail-layout.json' }); document.body.appendChild(a); a.click(); a.remove(); })));
    });
  }
  function importLayout() {
    openSheet('Import', b => {
      const ta = el('textarea', { placeholder: 'Paste layout text here' });
      const file = el('input', { type: 'file', accept: '.json,application/json,text/plain', on: { change: e => { const f = e.target.files[0]; if (f) f.text().then(t => { ta.value = t; }); } } });
      b.append(file, ta, el('div', { cls: 'row' }, btn('Load', () => {
        try { const s2 = C.deserialize(ta.value); pushUndo(); stopSim(); S = s2; changed(); fit(); closeSheet(); toast('Layout loaded'); } catch (e) { toast("That isn't a layout"); }
      }, 'primary')));
    });
  }

  // ---------------- Create Track Map
  function httpGet(url) {
    if (window.AndroidBridge && window.AndroidBridge.httpGet) {
      return new Promise((res, rej) => {
        const id = 'r' + Math.random().toString(36).slice(2);
        window.__http = window.__http || {};
        window.__http[id] = (ok, text) => { delete window.__http[id]; ok ? res(text) : rej(new Error(text)); };
        window.AndroidBridge.httpGet(url, id);
      });
    }
    return fetch(url, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
  }
  window.__httpDone = (id, ok, text) => { const f = window.__http && window.__http[id]; if (f) f(ok, text); };

  function fetchMap(raw, out) {
    const base = Imp.normUrl(raw);
    if (!base) { toast('Enter the map address'); return; }
    try { localStorage.setItem(KEY + '.mapurl', raw.trim()); } catch (e) { /* ignore */ }
    out.innerHTML = ''; out.append(el('div', { cls: 'status' }, 'Connecting to ' + base + ' …'));
    const get = p => httpGet(base + p).then(t => JSON.parse(t));
    Promise.all([get('/api/network'), get('/api/signals').catch(() => ({ signals: [] })), get('/api/trains').catch(() => ({ trains: [] }))])
      .then(([net, sigs, trains]) => {
        const dims = Imp.dimensions(net);
        out.innerHTML = '';
        if (!dims.length) { out.append(el('div', { cls: 'status' }, 'Connected, but the map has no track yet.')); return; }
        const pick = el('select', {}, dims.map(d => el('option', { value: d.id }, d.id.replace('minecraft:', '') + ' (' + d.tracks + ' pieces)')));
        const withTrains = el('input', { type: 'checkbox', checked: true });
        out.append(el('div', { cls: 'status' }, 'Connected: ' + (net.tracks || []).length + ' track pieces, ' + (net.stations || []).length + ' stations, ' + (sigs.signals || []).length + ' signals, ' + (trains.trains || []).length + ' trains.'),
          el('div', { cls: 'row' }, el('div', { cls: 'grow' }, pick)),
          el('label', { cls: 'check' }, withTrains, 'Bring the trains in too (first car of each becomes the loco - edit them after)'),
          el('div', { cls: 'row' }, btn('Import this map', () => {
            try {
              const s2 = Imp.build(C, net, sigs, withTrains.checked ? trains : { trains: [] }, pick.value);
              pushUndo(); stopSim(); S = s2; changed(); fit(); closeSheet();
              const i = S.importInfo; toast('Imported ' + Object.keys(S.edges).length + ' track pieces' + (i.skipped ? ' (' + i.skipped + ' things skipped)' : ''));
            } catch (e) { toast('Import failed: ' + e.message); }
          }, 'primary')));
      })
      .catch(e => {
        out.innerHTML = '';
        out.append(el('div', { cls: 'status' }, "Couldn't reach the map (" + (e.message || e) + '). Check: Minecraft is running with the world loaded, the address and port are right (open it in your phone browser to test), and both are on the same Wi-Fi. A PC firewall may need to allow port 3876.'));
      });
  }
  // links shared into the app from the browser
  window.onSharedText = text => {
    const m = String(text || '').match(/https?:\/\/[^\s]+/) || String(text || '').match(/\b\d{1,3}(\.\d{1,3}){3}(:\d+)?\b/);
    if (!m) { toast('Shared text has no link in it'); return; }
    try { localStorage.setItem(KEY + '.mapurl', m[0]); } catch (e) { /* ignore */ }
    openMenu();
    if (menuRefs) { menuRefs.url.value = m[0]; fetchMap(m[0], menuRefs.out); }
  };

  // ------------------------------------------------------------------ simulation
  function togglePlay() {
    playing = !playing;
    if (playing) {
      if (!snapshot) { snapshot = C.serialize(S); S.log = []; S.time = 0; }
      for (const id in S.consists) { const c = S.consists[id]; if (!c.run && !c.hold && c.schedule.length) C.startRun(S, id); }
      acc = 0; last = performance.now();
    } else save(true);
    updateHeader();
  }
  function stopSim() { playing = false; snapshot = null; updateHeader(); }
  function resetSim() {
    if (!snapshot) return;
    try { S = C.deserialize(snapshot); } catch (e) { /* keep current */ }
    snapshot = null; playing = false; sel = null; closeSheet(); updateHeader(); changed(); toast('Back to before Play');
  }
  function updateHeader() {
    const p = $('play'); p.textContent = playing ? '❚❚ Pause' : '▶ Play'; p.classList.toggle('on', playing);
    $('reset').hidden = !snapshot;
    $('clock').textContent = snapshot ? fmtTime(S.time) : '';
    $('speed').textContent = speed + '×';
  }
  $('play').onclick = togglePlay;
  $('reset').onclick = resetSim;
  $('speed').onclick = () => { speed = speed >= 8 ? 1 : speed * 2; updateHeader(); };
  $('undo').onclick = () => {
    if (pend) { setPend(null); return; }
    if (!undo.length) { toast('Nothing to undo'); return; }
    try { S = C.deserialize(undo.pop()); } catch (e) { return; }
    draft = null; if (sel && !exists(sel)) closeSheet(); else refresh(); changed(); setHint();
  };
  $('trainsBtn').onclick = openTrains;
  $('menuBtn').onclick = openMenu;
  $('logBtn').onclick = openLog;
  $('fit').onclick = fit;
  const zoomBy = f => { view.k = Math.max(0.03, Math.min(60, view.k * f)); dirty = true; };
  $('zin').onclick = () => zoomBy(1.5);
  $('zout').onclick = () => zoomBy(1 / 1.5);
  $('pbPlace').onclick = placePend;
  $('pbFlip').onclick = flipPend;
  $('pbStraight').onclick = straightPend;
  $('pbFit').onclick = fitPend;
  $('pbCancel').onclick = () => setPend(null);

  function setTool(t) {
    tool = t; draft = null;
    if (pend) setPend(null);
    for (const b of document.querySelectorAll('#tools button')) b.classList.toggle('on', b.dataset.tool === t);
    setHint(); dirty = true;
  }
  for (const b of document.querySelectorAll('#tools button')) b.onclick = () => setTool(b.dataset.tool);

  let last = performance.now(), liveT = 0;
  function frame(now) {
    const dt = Math.min(0.25, (now - last) / 1000); last = now;
    if (playing) {
      acc += dt * speed;
      let n = 0;
      try { while (acc >= 0.05 && n++ < 80) { C.step(S, 0.05); acc -= 0.05; } }
      catch (e) { console.error(e); playing = false; updateHeader(); toast('Simulation error: ' + e.message); }
      if (n >= 80) acc = 0;
      dirty = true;
      liveT += dt;
      if (liveT > 0.4) {
        liveT = 0;
        $('clock').textContent = fmtTime(S.time);
        if (sel && sel.kind === 'train') {
          if (!S.consists[sel.id]) { closeSheet(); }
          else {
            const ls = document.getElementById('liveStatus'); if (ls) ls.textContent = statusText(S.consists[sel.id]);
            if (!gesture) { const p = whereIs(sel), px = sx(p.x), py = sz(p.z); if (px < 0 || px > W || py < 0 || py > H * 0.42) ensureVisible(p); }
          }
        }
        if (sheetKind === 'trains') for (const d of body.querySelectorAll('[data-train]')) { const c = S.consists[d.dataset.train]; if (c) d.textContent = c.vehicles.length + ' vehicles · ' + (c.status || 'Parked'); }
      }
    }
    if (needSave && Date.now() - lastSave > 1500 && !playing) save(true);
    if (dirty) { dirty = false; try { draw(); } catch (e) { console.error(e); } }
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ start
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });
  resize();
  if (!load()) S = window.buildExample(C);
  fit(); setHint(); updateHeader();
  requestAnimationFrame(frame);
  // a link shared into the app before the page was ready
  try { const t = window.AndroidBridge && window.AndroidBridge.takeSharedText && window.AndroidBridge.takeSharedText(); if (t) window.onSharedText(t); } catch (e) { /* ignore */ }
  window.RailPlanner = { saveNow: () => save(true), back: () => { if (pend) { setPend(null); return true; } if (sheet.classList.contains('open')) { closeSheet(); return true; } if (draft) { draft = null; setHint(); dirty = true; return true; } return false; }, get state() { return S; }, togglePlay, fetchMap, openMenu, select, view };
})();

</script>
</body>
</html>
