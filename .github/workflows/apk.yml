name: Build Rail Planner APK
on:
  push:
    branches: [android-planner]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        run: gradle --no-daemon :app:assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Publish APK to planner-dist branch
        run: |
          mkdir out && cp app/build/outputs/apk/release/app-release.apk out/RailPlanner.apk
          cd out && git init -q -b planner-dist
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add RailPlanner.apk && git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" planner-dist
      - name: Publish log on failure
        if: failure()
        run: |
          mkdir logout && cp build.log logout/ 2>/dev/null || echo "no log" > logout/build.log
          cd logout && git init -q -b planner-buildlog
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" planner-buildlog
