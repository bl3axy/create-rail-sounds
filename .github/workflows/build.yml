name: build
on:
  push:
    branches: [outdoor-stuffs-port]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: justoutdoorstuffs
          path: |
            build/libs/*.jar
            
      - name: Publish to dist branch
        if: always()
        run: |
          mkdir dist && cp build-log.txt dist/ && (cp build/libs/*.jar dist/ || true)
          rm -f dist/*-sources.jar
          cd dist
          git init -q -b outdoor-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" outdoor-dist
