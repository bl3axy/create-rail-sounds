name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/check_migrations.py
      - run: chmod +x gradlew && set -o pipefail && ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Boot a test server and place every block in-game
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nenable-rcon=true\nrcon.port=25575\nrcon.password=railsounds\nspawn-protection=0\n" > run/server.properties
          set +e
          # phase A: place, tick, power, run commands, break - and leave a few blocks standing
          (timeout 600 ./gradlew runServer --args="nogui" > server-run.txt 2>&1 || true) &
          GRADLE_PID=$!
          python3 tools/ingame_test.py 127.0.0.1 25575 railsounds a 2>&1 | tee ingame-test.txt
          TEST_RC=${PIPESTATUS[0]}
          wait $GRADLE_PID 2>/dev/null || true
          cp run/logs/latest.log server-log.txt 2>/dev/null || cp server-run.txt server-log.txt

          echo "--- state files written by phase A ---"
          ls -la run/config/railsounds-crossings.json run/world/railsounds_*.json 2>&1 || true
          echo "--- crossings file contents ---"
          cat run/config/railsounds-crossings.json 2>/dev/null || echo "(no crossings file!)"
          cp run/config/railsounds-crossings.json crossings-after-phase-a.json 2>/dev/null || true
          # a real switch link needs Steam 'n' Rails and a player, neither of which exist on a
          # headless test server, so plant a link file to prove the load/parse path survives a
          # restart with its route-sensor filter intact.
          mkdir -p run/world
          echo '{"minecraft:overworld|5,-59,5":{"0":{"switchId":"11111111-2222-3333-4444-555555555555","x":7,"y":-59,"z":5,"filter":"Coal"}}}' > run/world/railsounds_towers.json
          # phase B: boot the SAME world again and check the leftovers came back and still tick
          (timeout 600 ./gradlew runServer --args="nogui" > server-run2.txt 2>&1 || true) &
          GRADLE_PID2=$!
          python3 tools/ingame_test.py 127.0.0.1 25575 railsounds b 2>&1 | tee -a ingame-test.txt
          TEST_RC2=${PIPESTATUS[0]}
          wait $GRADLE_PID2 2>/dev/null || true
          cp run/logs/latest.log server-log2.txt 2>/dev/null || cp server-run2.txt server-log2.txt
          cat server-log2.txt >> server-log.txt
          set -e
          [ "$TEST_RC" = "0" ] || TEST_RC=$TEST_RC
          [ "$TEST_RC2" = "0" ] || TEST_RC=$TEST_RC2
          echo "--- in-game test exit: $TEST_RC"
          echo "--- unexpected errors in the server log:"
          # Steam 'n' Rails is not installed on the test server, so its mixin targets are
          # legitimately absent; Create writes its own config on first run.
          grep -nE "ERROR|Exception|Caused by" server-log.txt \
            | grep -viE "NoSuchFileException|config/create|UnixException|No key layers|com[/.]railwayteam" \
            > unexpected.txt || true
          cat unexpected.txt
          if [ -s unexpected.txt ]; then echo "server log has unexpected errors"; exit 1; fi
          EXPECTED=$(ls src/main/resources/assets/railsounds/blockstates/*.json | wc -l)
          PRESENT=$(grep -c "RSTEST_PRESENT" server-log.txt || true)
          echo "blocks still present after ticking: $PRESENT / $EXPECTED"
          for MARK in "RSTEST_SURVIVED car_retarder" "RSTEST_SURVIVED crossing_signal" \
                      "RSTEST_SURVIVED cargo_sensor" "RSTEST_SURVIVED searchlight_signal" \
                      "RSTEST_TICKING retarder" "RSTEST_UNPOWERED retarder"; do
            if ! grep -q "$MARK" server-log.txt; then
              echo "restart check failed: $MARK never reported"
              exit 1
            fi
          done
          echo "--- state files after the restart ---"
          ls -la run/config/railsounds-crossings.json run/world/railsounds_*.json 2>&1 || true
          echo "--- crossings file after restart ---"
          cat run/config/railsounds-crossings.json 2>/dev/null || echo "(no crossings file!)"
          echo "--- towers (link) file after restart ---"
          cat run/world/railsounds_towers.json 2>/dev/null || echo "(no towers file!)"
          grep -q "11111111-2222-3333-4444-555555555555" run/world/railsounds_towers.json || { echo "the link file did not survive the restart"; exit 1; }
          grep -q "Coal" run/world/railsounds_towers.json || { echo "the link file lost its route-sensor filter on reload"; exit 1; }
          # the sensor display sources must bind on EVERY boot - init order between our mod and
          # Create's display-source setup is not stable, and binding from one side silently
          # failed on the second boot before this was made order-independent.
          BOUND=$(grep -c "sensor display sources bound" server-log.txt || true)
          BOOTS=$(grep -c "railroad blocks registered" server-log.txt || true)
          echo "sensor display sources bound on $BOUND of $BOOTS boots"
          if [ "$BOUND" != "$BOOTS" ]; then
            echo "display sources failed to bind on at least one boot"
            grep -n "display sources" server-log.txt || true
            exit 1
          fi
          echo "restart checks: blocks survived, crossing + link files persisted, ticks still running"
          if [ "$PRESENT" != "$EXPECTED" ]; then
            echo "some blocks vanished or changed state while ticking"
            grep -oE "RSTEST_PRESENT [a-z_]+" server-log.txt | sort > /tmp/present.txt || true
            ls src/main/resources/assets/railsounds/blockstates/*.json | xargs -n1 basename | sed 's/.json//;s/^/RSTEST_PRESENT /' | sort > /tmp/want.txt
            diff /tmp/want.txt /tmp/present.txt || true
            exit 1
          fi
          if [ "$TEST_RC" != "0" ]; then echo "in-game test failed"; exit 1; fi
      - name: Publish logs on failure
        if: failure()
        run: |
          mkdir logout
          cp build.log server-log.txt server-log2.txt unexpected.txt ingame-test.txt server-run.txt server-run2.txt crossings-after-phase-a.json logout/ 2>/dev/null || true
          cd logout
          git init -q -b buildlog
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" buildlog
      - name: Zip resource pack
        run: cd server-resourcepack && zip -qr ../create-rail-sounds-resourcepack.zip . -x README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: create-rail-sounds
          path: |
            build/libs/*.jar
            create-rail-sounds-resourcepack.zip
      - name: Publish to dist branch
        run: |
          mkdir dist && cp build/libs/*.jar create-rail-sounds-resourcepack.zip dist/
          cp server-log.txt dist/ 2>/dev/null || true
          rm -f dist/*-sources.jar
          cd dist
          git init -q -b dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist
